<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | Pawsitive Love Dog</title><link rel="stylesheet" href="1500.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="portal-page"><main class="portal-shell"><header class="portal-top"><a class="brand" href="1500.html"><span class="brand-mark">🐾</span><span>Pawsitive Love <b>Dog</b></span></a><button id="logout" hidden>Salir</button></header>
<section id="authView" class="auth-panel"><small>PORTAL DE CLIENTES</small><h1>Tu mascota.<br>Todo en un lugar.</h1><p>Crea tu cuenta para guardar perfiles, fotos e historial de cuidado.</p><div class="auth-tabs"><button data-auth="login" class="active">Entrar</button><button data-auth="signup">Crear cuenta</button></div><form id="authForm"><label>Email<input type="email" name="email" required></label><label>Contraseña<input type="password" name="password" minlength="6" required></label><label id="nameField" hidden>Nombre<input name="name"></label><button class="portal-primary">Continuar →</button><div id="authStatus" class="status-box"></div></form></section>
<section id="accountView" hidden><div class="portal-heading"><div><small>MI CUENTA</small><h1>Mis mascotas</h1></div><button class="portal-primary" id="addPet">+ Añadir mascota</button></div><div id="petGrid" class="pet-grid"></div></section>
<div id="petModal" class="pet-modal" hidden><form id="petForm" class="pet-editor"><header><div><small>PERFIL DE MASCOTA</small><h2>Nueva mascota</h2></div><button type="button" id="closePet">×</button></header><label>Foto<input type="file" name="photo" accept="image/jpeg,image/png,image/webp"></label><div class="wizard-grid"><label>Nombre<input name="name" required></label><label>Raza<input name="breed" required></label><label>Fecha de nacimiento<input type="date" name="birth_date"></label><label>Peso (lb)<input type="number" step=".1" name="weight_lbs"></label></div><label>Temperamento<input name="temperament" placeholder="Tranquilo, nervioso, juguetón..."></label><label>Alergias / sensibilidad<input name="allergies"></label><label>Notas<textarea name="notes" rows="3"></textarea></label><button class="portal-primary">Guardar mascota →</button><div id="petStatus" class="status-box"></div></form></div>
<div id="historyModal" class="pet-modal" hidden><section class="pet-editor"><header><div><small>HISTORIAL</small><h2 id="historyTitle">Historial</h2></div><button type="button" id="closeHistory">×</button></header><div id="historyRows"></div></section></div>
</main><script src="cuenta.js"></script></body></html>
