<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointments | Pawsitive Love Dog</title><link rel="stylesheet" href="1500.css"></head><body class="admin-page"><main class="admin-shell"><header><div><small>PAWSITIVE LOVE DOG / ADMIN</small><h1>Citas</h1></div><button id="refreshBookings">Actualizar</button></header><div class="admin-stats"><div><span>Solicitudes</span><b id="bookingCount">—</b></div><div><span>Pendientes</span><b id="newCount">—</b></div></div><section><div class="admin-table-head"><b>Solicitudes recientes</b><span>Cliente · Mascota · Servicios · Total</span></div><div id="bookingRows" class="booking-rows"><p>Cargando…</p></div></section></main><script>
async function load(){const box=document.getElementById("bookingRows");try{const r=await fetch("/api/admin-bookings");const o=await r.json();if(!r.ok)throw 0;document.getElementById("bookingCount").textContent=o.items.length;document.getElementById("newCount").textContent=o.items.filter(x=>x.status==="new").length;box.innerHTML=o.items.length?o.items.map(x=>`<article><div><small>${new Date(x.created_at).toLocaleString()}</small><strong>${x.customer_name}</strong><a href="tel:${x.phone}">${x.phone}</a><a href="mailto:${x.email}">${x.email}</a></div><div><small>MASCOTA</small><strong>${x.pet_name}</strong><span>${x.breed}</span></div><div><small>SERVICIOS</small><strong>${x.services.join(" · ")}</strong><span>${x.preferred_date||"Fecha por coordinar"} · ${x.preferred_time||"Flexible"}</span></div><div class="admin-price"><small>ESTIMADO</small><strong>$${Number(x.estimated_total).toFixed(0)}</strong><span>${x.status}</span></div></article>`).join(""):"<p>No hay citas todavía.</p>"}catch{box.innerHTML="<p>No se pudieron cargar las citas. Verifica la configuración del servidor.</p>"}}load();document.getElementById("refreshBookings").onclick=load;
</script></body></html>
